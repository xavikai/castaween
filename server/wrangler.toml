name = "castaween-relay"
main = "worker.js"
compatibility_date = "2026-10-23"
workers_dev = true

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }, { name = "REVIEWS", class_name = "ReviewStore" }, { name = "PRESENCE", class_name = "Presence" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2-model-reviews"
new_sqlite_classes = ["ReviewStore"]

[[migrations]]
tag = "v3-presence"
new_sqlite_classes = ["Presence"]
