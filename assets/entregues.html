<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entregues de models · Castaween</title><style>body{background:#0e1122;color:#f4ead6;font:17px/1.6 system-ui;max-width:680px;margin:60px auto;padding:20px}a{color:#ffad67}</style></head><body><h1>Entregues de models</h1><p id="status" role="status">Connectant amb la plataforma d’entregues…</p><p><a id="open" hidden>Obre les entregues</a></p><a href="../">← Torna a Castaween</a><script>
(async()=>{try{const r=await fetch('online.json',{cache:'no-store'});if(!r.ok)throw Error();const c=await r.json(),url=new URL(c.servidor.replace(/^ws/,'http'));if(!['http:','https:'].includes(url.protocol))throw Error();url.pathname='/models';url.search=url.hash='';const link=document.querySelector('#open');link.href=url.href;link.hidden=false;location.replace(url.href);}catch{document.querySelector('#status').textContent='No s’ha pogut connectar. Torna-ho a provar quan tinguis connexió o demana ajuda al professor.';}})();
